services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
  frontend:
    build: ./my-app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - EXPO_NO_INTERACTIVE=false
    stdin_open: true
    tty: true
    command: ["npx", "expo", "start", "--lan"]
